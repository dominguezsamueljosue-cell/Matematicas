<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Índice - Matemáticas</title>
    <style>
        body {
            background-color: #121212;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 40px 30px;
            border-radius: 15px;
            border: 2px solid #ffd700;
            box-shadow: 0 4px 25px rgba(255, 215, 0, 0.25);
        }

        h1 {
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-size: 32px;
        }

        p.subtitulo {
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 25px;
        }

        hr {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin-bottom: 30px;
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-menu {
            display: block;
            padding: 15px 20px;
            background-color: #262626;
            color: #ffd700;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            border: 1px solid #ffd700;
            transition: all 0.3s ease;
        }

        .btn-menu:hover {
            background-color: #ffd700;
            color: #121212;
            box-shadow: 0 0 15px #ffd700;
            transform: translateY(-2px);
        }

        .btn-evaluacion {
            background-color: #ffd700;
            color: #121212;
            margin-top: 10px;
        }

        .btn-evaluacion:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Matemáticas V</h1>
        <p class="subtitulo">Índice Principal de Contenidos</p>
        <hr>

        <div class="menu-links">
            <a href="profes.html" class="btn-menu">1. Lección y Video de Matemáticas</a>
            <a href="Porcentajes.html" class="btn-menu">2. Porcentajes</a>
            <a href="signos.html" class="btn-menu">3 Ley de los Signos.</a>
            <a href="evaluacion.html" class="btn-menu btn-evaluacion">5. Ir a la Evaluación</a>
        </div>
    </div>

</body>
</html>
