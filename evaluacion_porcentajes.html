<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evaluación de Matemáticas</title>
    <style>
        body {
            background-color: #121212;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2);
        }

        h1 {
            color: #ffd700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        p.intro {
            text-align: center;
            color: #cccccc;
            margin-bottom: 30px;
        }

        hr {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin-bottom: 30px;
        }

        .pregunta {
            margin-bottom: 25px;
            background-color: #262626;
            padding: 18px;
            border-radius: 8px;
            border-left: 4px solid #ffd700;
        }

        label.titulo-pregunta {
            font-weight: bold;
            font-size: 17px;
            color: #ffffff;
            display: block;
            margin-bottom: 12px;
        }

        .opcion {
            margin: 8px 0;
            color: #e6ca65;
            font-size: 15px;
            cursor: pointer;
            display: block;
        }

        input[type="radio"] {
            accent-color: #ffd700;
            margin-right: 10px;
            transform: scale(1.2);
        }

        .btn-contenedor {
            text-align: center;
            margin-top: 35px;
        }

        .btn-principal {
            display: inline-block;
            padding: 12px 30px;
            background-color: #ffd700;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 25px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-principal:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 15px #ffd700;
        }
    </style>
</head>

    <div class="pregunta">
    <label class="titulo-pregunta">1. Según Daniel Carreón, ¿qué significa el concepto de porcentaje o tanto por ciento?</label>
    <label class="opcion"><input type="radio" name="preg_v1" value="a"> Un número que siempre es mayor a mil.</label>
    <label class="opcion"><input type="radio" name="preg_v1" value="b"> Una cantidad que se toma de cada 100 partes iguales.</label>
    <label class="opcion"><input type="radio" name="preg_v1" value="c"> La suma de dos números enteros cualesquiera.</label>
</div>

<div class="pregunta">
    <label class="titulo-pregunta">2. ¿Con qué símbolo se representa el porcentaje en matemáticas?</label>
    <label class="opcion"><input type="radio" name="preg_v2" value="a"> $</label>
    <label class="opcion"><input type="radio" name="preg_v2" value="b"> #</label>
    <label class="opcion"><input type="radio" name="preg_v2" value="c"> %</label>
</div>

<div class="pregunta">
    <label class="titulo-pregunta">3. Si Daniel Carreón dice que el 20% de los alumnos juegan fútbol, ¿qué significa?</label>
    <label class="opcion"><input type="radio" name="preg_v3" value="a"> Que de cada 100 alumnos, 20 juegan fútbol.</label>
    <label class="opcion"><input type="radio" name="preg_v3" value="b"> Que en total solo hay 20 alumnos en la escuela.</label>
    <label class="opcion"><input type="radio" name="preg_v3" value="c"> Que 20 alumnos no van a la escuela.</label>
</div>

<div class="pregunta">
    <label class="titulo-pregunta">4. Para calcular un porcentaje como el 25% en forma decimal, ¿por cuánto se debe multiplicar?</label>
    <label class="opcion"><input type="radio" name="preg_v4" value="a"> Por 2.5</label>
    <label class="opcion"><input type="radio" name="preg_v4" value="b"> Por 0.25</label>
    <label class="opcion"><input type="radio" name="preg_v4" value="c"> Por 25.0</label>
</div>

<div class="pregunta">
    <label class="titulo-pregunta">5. ¿Cómo se representa el 100% de una cantidad en número decimal?</label>
    <label class="opcion"><input type="radio" name="preg_v5" value="a"> 1.0 (o el entero completo)</label>
    <label class="opcion"><input type="radio" name="preg_v5" value="b"> 0.01</label>
    <label class="opcion"><input type="radio" name="preg_v5" value="c"> 100.0</label>
</div>
